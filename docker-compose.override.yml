# Local adjustments carried over from the previous hand-rolled Zammad stack:
#   - keep the existing bind-mounted data in ./data instead of named volumes
#   - publish nginx on loopback only, for the host's native nginx to proxy to

x-zammad-volumes: &zammad-volumes
  volumes:
    - ./data/zammad-backup:/var/tmp/zammad:ro
    - ./data/zammad-storage:/opt/zammad/storage

services:
  zammad-init:
    <<: *zammad-volumes
  zammad-railsserver:
    <<: *zammad-volumes
  zammad-scheduler:
    <<: *zammad-volumes
  zammad-websocket:
    <<: *zammad-volumes

  zammad-nginx:
    <<: *zammad-volumes
    # The host's nginx terminates TLS and proxies here over plain http. Without this, Rails
    #   is told the request was http, drops the Secure session cookie, and every form fails
    #   with "CSRF token verification failed".
    environment:
      NGINX_SERVER_SCHEME: https
    # !override, otherwise Compose appends to upstream's 0.0.0.0:8080 instead of replacing it.
    ports: !override
      - "127.0.0.1:10003:8080"

  zammad-backup:
    volumes:
      - ./data/zammad-backup:/var/tmp/zammad
      - ./data/zammad-storage:/opt/zammad/storage

  zammad-postgresql:
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data

  zammad-redis:
    volumes:
      - ./data/redis:/data

  # Outgoing mail relay to Microsoft 365. Our Exchange inbound connector ("Tools") identifies
  #   the sender by its TLS certificate (*.focusfinance.bi), and Zammad's SMTP client cannot
  #   present one. Zammad sends here instead (host zammad-smtp-relay, port 587, no login, SSL
  #   verification off), and Postfix forwards to our tenant's MX presenting the host's
  #   Let's Encrypt certificate for support.focusfinance.bi. Not published on the host.
  zammad-smtp-relay:
    image: boky/postfix:5.1.0-alpine
    restart: ${RESTART:-always}
    environment:
      ALLOWED_SENDER_DOMAINS: focusfinance.bi
      RELAYHOST: "[focusfinance-bi.mail.protection.outlook.com]:25"
      POSTFIX_myhostname: support.focusfinance.bi
      POSTFIX_smtp_tls_security_level: encrypt
      POSTFIX_smtp_tls_cert_file: /etc/letsencrypt/live/support.focusfinance.bi/fullchain.pem
      POSTFIX_smtp_tls_key_file: /etc/letsencrypt/live/support.focusfinance.bi/privkey.pem
      POSTFIX_smtp_tls_loglevel: "1"
    volumes:
      # The whole tree, since live/ only holds symlinks into archive/.
      - /etc/letsencrypt:/etc/letsencrypt:ro

  zammad-elasticsearch:
    # 9.x images are built on Red Hat UBI 9, whose glibc needs an x86-64-v2 CPU; our VM
    #   reports a generic "Common KVM processor" without it. 8.x images are Ubuntu-based
    #   and run fine. Only lift this once the VM's CPU type exposes x86-64-v2.
    image: elasticsearch:${ELASTICSEARCH_VERSION:-8.19.4}
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
